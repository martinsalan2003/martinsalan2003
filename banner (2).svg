<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame">
      <rect width="900" height="220" rx="12"/>
    </clipPath>
    <clipPath id="typeClip1">
      <rect x="60" y="168" height="18">
        <animate attributeName="width"
          keyTimes="0;0.1667;0.3333;0.4222;0.4556;0.6222;0.7889;0.8778;1"
          values="0;260;260;0;0;0;0;0;0"
          dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="typeClip2">
      <rect x="60" y="168" height="18">
        <animate attributeName="width"
          keyTimes="0;0.1667;0.3333;0.4222;0.4556;0.6222;0.7889;0.8778;1"
          values="0;0;0;0;0;260;260;0;0"
          dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="#0d1117"/>

    <!-- tesselated wall motif, echoing the tiled background from the photo -->
    <g>
      <!-- static base grid, low contrast -->
      <g fill="#161b22">
        <rect x="560" y="20" width="46" height="46"/>
        <rect x="610" y="20" width="46" height="46"/>
        <rect x="660" y="20" width="46" height="46"/>
        <rect x="710" y="20" width="46" height="46"/>
        <rect x="760" y="20" width="46" height="46"/>
        <rect x="810" y="20" width="46" height="46"/>
        <rect x="560" y="70" width="46" height="46"/>
        <rect x="610" y="70" width="46" height="46"/>
        <rect x="660" y="70" width="46" height="46"/>
        <rect x="710" y="70" width="46" height="46"/>
        <rect x="760" y="70" width="46" height="46"/>
        <rect x="810" y="70" width="46" height="46"/>
        <rect x="560" y="120" width="46" height="46"/>
        <rect x="610" y="120" width="46" height="46"/>
        <rect x="660" y="120" width="46" height="46"/>
        <rect x="710" y="120" width="46" height="46"/>
        <rect x="760" y="120" width="46" height="46"/>
        <rect x="810" y="120" width="46" height="46"/>
        <rect x="560" y="170" width="46" height="46"/>
        <rect x="610" y="170" width="46" height="46"/>
        <rect x="660" y="170" width="46" height="46"/>
        <rect x="710" y="170" width="46" height="46"/>
        <rect x="760" y="170" width="46" height="46"/>
        <rect x="810" y="170" width="46" height="46"/>
      </g>

      <!-- select tiles quietly breathe in the brand green, staggered -->
      <rect x="610" y="20" width="46" height="46" fill="#2FB380" opacity="0.12">
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="4.2s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="760" y="70" width="46" height="46" fill="#2FB380" opacity="0.12">
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="660" y="120" width="46" height="46" fill="#2FB380" opacity="0.12">
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="5s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="810" y="170" width="46" height="46" fill="#2FB380" opacity="0.12">
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="4.6s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="560" y="170" width="46" height="46" fill="#2FB380" opacity="0.12">
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="3.9s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="710" y="20" width="46" height="46" fill="#2FB380" opacity="0.12">
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="4.9s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- text block -->
    <text x="60" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#E6EDF3">Alan Martins</text>
    <text x="60" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
      <tspan fill="#8B949E">Desenvolvedor </tspan><tspan fill="#2FB380" font-weight="700">Front-end</tspan>
    </text>

    <rect x="60" y="150" width="220" height="2" fill="#2FB380" opacity="0.6"/>

    <text x="60" y="182" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2FB380" clip-path="url(#typeClip1)">$ arquitetura e segurança</text>
    <text x="60" y="182" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2FB380" clip-path="url(#typeClip2)">$ código melhor que ontem</text>

    <rect y="169" width="9" height="16" fill="#2FB380">
      <animate attributeName="x"
        keyTimes="0;0.1667;0.3333;0.4222;0.4556;0.6222;0.7889;0.8778;1"
        values="60;320;320;60;60;320;320;60;60"
        dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
